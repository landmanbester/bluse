[project]
name = "bluse"
version = "0.1.0"
description = "Technosignature post-processing for BLUSE/MeerKAT narrowband hits"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Landman Bester" }]
keywords = ["seti", "technosignature", "radio-astronomy", "meerkat", "breakthrough-listen"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]

# Pinned only where a floor is load-bearing:
#   scikit-learn 1.3 is the first release to ship sklearn.cluster.HDBSCAN, which
#   the whole of Track B is built on.
dependencies = [
    "h5py>=3.8",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Cluster Bench, the interactive explorer.
bench = [
    "fastapi>=0.110",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
]
# UMAP embeddings in Cluster Bench. Optional because it drags in numba/llvmlite,
# which is a heavy install for a feature that falls back to PCA if absent.
umap = ["umap-learn>=0.5.5"]
# The test suite. tests/unit is synthetic and runs anywhere; tests/workspace
# needs a features/ directory and is skipped without one.
dev = [
    "pytest>=7.4",
    "ipdb>=0.13.13",
]
all = ["bluse[bench,umap,dev]"]

[project.scripts]
bluse-explore  = "bluse.explore:main"
bluse-track-a  = "bluse.track_a_filter:main"
bluse-features = "bluse.track_b_features:main"
bluse-cluster  = "bluse.track_b_cluster:main"
bluse-bench    = "bluse.bench.app:main"
bluse-score    = "bluse.track_e_score:main"
bluse-score-plots = "bluse.track_e_plots:main"
bluse-score-slides = "bluse.track_e_slides:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bluse"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is a package, so `from tests.unit import fixtures` needs the repo root
# importable. Without this the suite collects only when pytest is invoked from
# the repo root, which is exactly the "runs on one machine" failure the
# synthetic fixtures exist to avoid.
pythonpath = ["."]
markers = [
    "workspace: needs a BLUSE workspace with features/; skipped without one",
]
